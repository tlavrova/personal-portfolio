<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Tatiana Lavrova — Frontend Software Engineer in Amsterdam building web applications with Angular, React and TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tatiana Lavrova — Frontend Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio, experience and projects of Tatiana Lavrova, Frontend Software Engineer in Amsterdam."
    />
    <meta property="og:url" content="https://tlavrova.github.io/personal-portfolio/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Apply the saved/system theme before first paint to avoid a light-mode flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Tatiana Lavrova — Frontend Software Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
